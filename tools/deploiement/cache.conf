# Réglage du cache de https://tower.izicraft.fr, tel qu'installé sur thnas le 22 novembre 2026 :
#   /etc/nginx/conf.d/tower.izicraft.fr.d/tower-cache.conf
# (un fichier à part, au niveau du domaine : la configuration de l'application my_webapp__4, générée par YunoHost,
# peut être réécrite à chaque mise à jour). Le navigateur garde les fichiers mais revérifie à chaque visite qu'ils
# n'ont pas changé : après une mise à jour, un simple rechargement suffit, sans mélange d'ancien et de nouveau code.
# La compression gzip est déjà activée par YunoHost pour ce domaine (un second « gzip on » y est refusé).
more_set_headers "Cache-Control: no-cache";
