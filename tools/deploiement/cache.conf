# À ajouter dans la configuration nginx du site (bloc « location / » de l'application my_webapp du jeu).
# Le navigateur garde les fichiers mais vérifie à chaque visite qu'ils n'ont pas changé : après une mise à jour,
# un simple rechargement suffit, sans mélange d'ancien et de nouveau code, et les images inchangées ne sont pas
# retéléchargées.
add_header Cache-Control "no-cache" always;
