# À ajouter dans la configuration nginx du site, à côté de cache.conf (bloc « location / » de l'application).
# Compresse à l'envoi le code et les données (les images .png le sont déjà : non listées).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
