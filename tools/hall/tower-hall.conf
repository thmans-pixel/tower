# Passe /api/ de https://tower.izicraft.fr au hall of fame (spec 018), tel qu'installé sur thnas :
#   /etc/nginx/conf.d/tower.izicraft.fr.d/tower-hall.conf
# (à côté de tower-cache.conf : la configuration de l'application my_webapp__4 peut être réécrite par YunoHost).
location /api/ {
    proxy_pass http://127.0.0.1:8029;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    client_max_body_size 4k;
    # Pas de journal d'accès pour cette partie (le journal d'erreurs de nginx peut noter une adresse si le service est arrêté).
    access_log off;
}
